name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run bundle:report

  # The bridge's Windows parts (named pipe, icacls, the HKCU registry entry,
  # the .bat launcher) can only be tested on Windows. Decided on Linux first,
  # so a Windows runner starts only when the bridge (or what tests it) changed:
  # Windows minutes cost double on private repositories.
  bridge-changed:
    name: Bridge changed?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" HEAD > changed.txt
          if grep -E '^(bridge/|tests/integration/bridge-|tests/unit/(bridge|install-lib)\.test\.ts|\.github/workflows/ci\.yml|package(-lock)?\.json|vitest\.config\.ts)' changed.txt > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  bridge-windows:
    name: Bridge (Windows)
    needs: bridge-changed
    if: needs.bridge-changed.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/integration/bridge-windows.test.ts tests/unit/bridge.test.ts tests/unit/install-lib.test.ts
