name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run bundle:report

  # The bridge's Windows parts (named pipe, icacls, the HKCU registry entry,
  # the .bat launcher) can only be tested on Windows. Only when the bridge
  # changes: Windows minutes cost double on private repositories.
  bridge-windows:
    name: Bridge (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed the bridge?
        id: changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git cat-file -e "$base" 2>/dev/null \
            || git diff --name-only "$base" HEAD | grep -qE '^(bridge/|tests/integration/bridge-|tests/unit/(bridge|install-lib)\.test\.ts|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.run == 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true'
        run: npx vitest run tests/integration/bridge-windows.test.ts tests/unit/bridge.test.ts tests/unit/install-lib.test.ts
